# ==============================================================================
# Purpose: Implements Pod Security Standards (PSS) & Checkov-compliant Hardening.
# Security Controls:
#   1. Custom isolated namespace ('production') avoiding 'default'.
#   2. automountServiceAccountToken disabled to block credential leakage.
#   3. Enforced SHA256 image digest pinning and ImagePullPolicy: Always.
#   4. Configured Liveness and Readiness health probes.
#   5. runAsNonRoot, readOnlyRootFilesystem, and dropped Linux capabilities.
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hardened-secure-app
  namespace: production
  labels:
    app: secure-workload
spec:
  replicas: 2
  selector:
    matchLabels:
      app: secure-workload
  template:
    metadata:
      labels:
        app: secure-workload
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: app-container
          image: nginxinc/nginx-unprivileged:alpine@sha256:7b51b2a95c3a4d4ecb95420317e0892011b9a9d7003fffaad1e0b0e5faeb49e2
          imagePullPolicy: Always
          ports:
            - containerPort: 8080

          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
              
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          resources:
            limits:
              cpu: "500m"
              memory: "256Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"

          volumeMounts:
            - mountPath: /tmp
              name: temp-volume
            - mountPath: /var/cache/nginx
              name: cache-volume
            - mountPath: /var/run
              name: run-volume

      volumes:
        - name: temp-volume
          emptyDir: {}
        - name: cache-volume
          emptyDir: {}
        - name: run-volume
          emptyDir: {}