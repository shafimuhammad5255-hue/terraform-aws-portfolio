# ==============================================================================
# Purpose: Implements Role-Based Access Control (RBAC) in a scoped namespace.
# ==============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secure-app-sa
  namespace: production
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: config-reader-role
  namespace: production
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: read-config-binding
  namespace: production
subjects:
  - kind: ServiceAccount
    name: secure-app-sa
    namespace: production
roleRef:
  kind: Role
  name: config-reader-role
  apiGroup: rbac.authorization.k8s.io