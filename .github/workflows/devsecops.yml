name: DevSecOps IaC and Container Security Audit

on: [push]

# Explicitly set secure top-level read permissions 
permissions: read-all

jobs:
  # 1. Checkov IaC & Workflow Audit
  checkov-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master

  # 2. Trivy Container Security Scan
  trivy-container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t vulnerable-app:latest 8-container-security/
      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'vulnerable-app:latest'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'

  # 3. Bandit SAST Python Scan
  bandit-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bandit
        run: pip install bandit
      - name: Run Bandit Scan
        run: bandit -r . -f txt -o bandit_results.txt || exit 0

  # 4. Gitleaks Secret Scanning
  gitleaks-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

